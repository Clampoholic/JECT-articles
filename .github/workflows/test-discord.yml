
name: Test JECT Discord

on:
  workflow_dispatch:

jobs:
  test-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send test notification
        env:
          WEBHOOK_URL: ${{ secrets.JECT_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::JECT_WEBHOOK_URL secret is missing."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            -H "Content-Type: application/json" \
            -d '{"content":"📚 JECT Research Alerts test successful! Future new articles will appear here."}' \
            "$WEBHOOK_URL"
