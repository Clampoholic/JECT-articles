
name: Repost 5 JECT Articles

on:
  workflow_dispatch:

jobs:
  repost-five:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Post five recent articles
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.JECT_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          from monitor import get_articles, send_to_discord

          articles = get_articles()

          if not articles:
              raise RuntimeError("No JECT articles were found.")

          # get_articles() returns oldest to newest.
          # Take the newest five and post in chronological order.
          selected = articles[-5:]

          print(f"Retrieved {len(articles)} articles.")
          print(f"Posting {len(selected)} recent articles.")

          for article in selected:
              send_to_discord(article)
              print(f"Posted: {article['title']}")

          print("JECT repost test complete!")
          PY
